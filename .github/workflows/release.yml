name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact prerelease tag matching both package versions
        required: true
        default: v0.1.0-rc.4
permissions:
  contents: read
concurrency:
  group: payments-sdk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check installed clients and release version
        run: |
          python tools/check.py --output verification.json
          python tools/build_release.py --output dist --expect-tag "$RELEASE_TAG"
      - name: Publish a new evaluation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Refusing to overwrite an existing tag.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* verification.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Payments SDK $RELEASE_TAG" \
            --notes-file docs/release-notes.md
